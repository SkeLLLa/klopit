[settings]
lockfile = true
http_retries = 3
pin = true
fetch_remote_versions_cache = "4h"
use_versions_host_track = false

[settings.status]
missing_tools = "always"

[tools]
node = "26.11.1"
pnpm = "12.9.1"
mkcert = "1.4.4"

[tasks.certs]
description = "Create a dev TLS certificate in .certs/ (extra hosts as args, e.g. a LAN IP)"
run = """
mkdir -p .certs
mkcert -install
mkcert -key-file .certs/key.pem -cert-file .certs/cert.pem localhost 127.0.0.1 ::1
"""

[tasks.sync-versions]
description = "Sync tool versions from .mise.toml to package.json"
run = '''
#!/usr/bin/env bash
set -euo pipefail
PNPM_VERSION=$(mise current pnpm)
NODE_VERSION=$(mise current node)
cd "{{config_root}}"
node -e "
const fs = require('fs');
const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
pkg.packageManager = 'pnpm@' + '$PNPM_VERSION';
pkg.devEngines = {
  runtime: { name: 'node', version: '>=' + '$NODE_VERSION'.split('.')[0] }
};
fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
"
echo "Synced: node=$NODE_VERSION pnpm=$PNPM_VERSION"
'''
