<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>

    <!-- Subtle dot grid -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.8" fill="#334155" opacity="0.45"/>
    </pattern>

    <!-- Emerald radial glow from icon area -->
    <radialGradient id="glow" cx="168" cy="296" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon drop-shadow filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── Background layers ── -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="640" fill="#10B981"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="636" width="1280" height="4" fill="#10B981" opacity="0.25"/>

  <!-- ── Right-side decorations ── -->

  <!-- Large faint "38" watermark -->
  <text
    x="1010" y="470"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Arial, sans-serif"
    font-size="360" font-weight="900"
    fill="#10B981" opacity="0.04"
  >38</text>

  <!-- Rising dashed chart line (echoes the icon's sparkline) -->
  <polyline
    points="620,528 742,452 836,478 966,364 1092,402 1240,290"
    fill="none" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.13"
    stroke-dasharray="10 5" stroke-linecap="round"
  />
  <polyline
    points="640,558 768,498 868,522 1000,420 1120,456 1260,348"
    fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.07"
    stroke-dasharray="6 4" stroke-linecap="round"
  />
  <!-- Terminal dots on chart lines -->
  <circle cx="1240" cy="290" r="5" fill="#10B981" opacity="0.18"/>
  <circle cx="1240" cy="290" r="2.5" fill="#10B981" opacity="0.4"/>

  <!-- ── App Icon (viewBox 0 0 64 64, scale 2.75, placed at 80,208) ── -->
  <!--  Actual emerald rect: x 4→60, y 4→60 in VB  →  screen x 91-245, y 219-373  -->
  <g transform="translate(80, 208) scale(2.75)" filter="url(#iconShadow)">
    <rect x="4"  y="4"  width="56" height="56" rx="12" fill="#10B981"/>
    <rect x="18" y="14" width="28" height="36" rx="3"  fill="#FFFFFF" opacity="0.96"/>
    <polyline points="36,14 46,24 36,24 36,14" fill="#D1FAE5"/>
    <line x1="22" y1="29" x2="42" y2="29"
          stroke="#6EE7B7" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="34" x2="35" y2="34"
          stroke="#6EE7B7" stroke-width="2" stroke-linecap="round"/>
    <polyline points="22,43 28,38 33,40 41,33"
              fill="none" stroke="#059669" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="41" cy="33" r="1.8" fill="#059669"/>
  </g>

  <!-- ── App name: "klo" emerald + "PIT" white ── -->
  <!-- Baseline at y=325 vertically centres with icon midpoint y≈296 -->
  <text
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800" font-size="88" letter-spacing="-2"
  >
    <tspan x="278" y="325" fill="#10B981">klo</tspan><tspan fill="#F8FAFC">PIT</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text
    x="280" y="374"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="25" font-weight="500" fill="#94A3B8"
  >PIT-38 Tax Calculator for Polish Investors</text>

  <!-- ── Feature summary line ── -->
  <text
    x="280" y="416"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="19" fill="#475569"
  >CSV import  ·  NBP rates  ·  FIFO cost basis  ·  PIT-38 &amp; PIT/ZG  ·  Browser-only</text>

  <!-- ── Divider ── -->
  <line x1="80" y1="450" x2="640" y2="450" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ── Feature badge chips ── -->

  <!-- Browser-only (emerald) -->
  <rect x="80"  y="468" width="178" height="42" rx="21" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>
  <text x="169" y="494" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="15" font-weight="600" fill="#34D399"
  >Browser-only</text>

  <!-- Interactive Brokers (blue) -->
  <rect x="272" y="468" width="204" height="42" rx="21" fill="#0C1E3D" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="374" y="494" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="15" font-weight="600" fill="#93C5FD"
  >Interactive Brokers</text>

  <!-- FIFO (slate) -->
  <rect x="490" y="468" width="148" height="42" rx="21" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="564" y="494" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="15" font-weight="600" fill="#94A3B8"
  >FIFO Method</text>

  <!-- AGPL (amber) -->
  <rect x="652" y="468" width="166" height="42" rx="21" fill="#1C1207" stroke="#D97706" stroke-width="1.5"/>
  <text x="735" y="494" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="15" font-weight="600" fill="#FCD34D"
  >Open-source · AGPL</text>

  <!-- ── URL ── -->
  <text
    x="1200" y="608"
    text-anchor="end"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="600" fill="#10B981" opacity="0.85"
  >klopit.co.pl</text>
</svg>
